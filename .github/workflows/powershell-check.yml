name: PowerShell validation

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/powershell-check.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/powershell-check.yml'

jobs:
  validate-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts, tests -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Dry-run installer
        shell: powershell
        run: .\scripts\install.ps1 -DryRun
      - name: Isolated install and rollback tests
        shell: powershell
        run: .\tests\installer.tests.ps1

  validate-powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts, tests -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Dry-run installer
        shell: pwsh
        run: .\scripts\install.ps1 -DryRun
      - name: Isolated install and rollback tests
        shell: pwsh
        run: .\tests\installer.tests.ps1
